    const risk=Math.max(0,Math.min(1,
      0.35*(1-f.elev/80) + 0.20*(f.imp/100) + 0.30*Math.min(1,r1/180) + 0.15*(1-Math.min(f.dw,2)/2)));
    const lvl=risk<0.2?'低':risk<0.5?'中':risk<0.8?'高':'极高';
    const level=(risk*r1/180*0.5).toFixed(2);
    const rec=(risk*0.5).toFixed(1);
    return {...f,risk,risk_text:lvl,level,rec};
  }).sort((a,b)=>b.risk-a.risk);
  if(layer)map.removeLayer(layer);
  layer=L.layerGroup();
  res.forEach(f=>L.circleMarker([f.lat,f.lon],{radius:7,color:riskColor(f.risk),fillColor:riskColor(f.risk),fillOpacity:.85,weight:1})
    .bindTooltip(f.name+'<br>风险 '+f.risk.toFixed(2)+' ('+f.risk_text+')<br>预测水位 '+f.level+'m')
    .addTo(layer));
  layer.addTo(map);
  const tb=document.querySelector('#tbl tbody');
  tb.innerHTML=res.map(f=>'<tr><td>'+f.name+'</td><td>'+f.risk.toFixed(2)+'</td><td><span class="dot" style="background:'+riskColor(f.risk)+'"></span>'+f.risk_text+'</td><td>'+f.level+'</td><td>'+f.rec+'</td><td>'+f.elev+'</td><td>'+f.imp+'</td></tr>').join('');
}
function loadScenario(){
  const s=SCEN[document.getElementById('scenario').value];if(!s)return;
  document.getElementById('r1').value=s.r1;document.getElementById('r2').value=s.r2;
  document.getElementById('r3').value=s.r3;document.getElementById('rmax').value=s.rmax;
  run();
}
run();
</script></body></html>
