const map = L.map('map').setView([22.62,114.15], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const colors = ['#2a9d8f','#e9c46a','#f4a261','#e76f51','#c1121f'];
function colorFor(v,mx){ const r=Math.min(1,v/mx); return colors[Math.min(colors.length-1, Math.floor(r*colors.length))]; }
let layer;
function render(mode){
  if(layer) map.removeLayer(layer);
  const vals = DATA.map(d=>d[mode]); const mx=Math.max(...vals,0.001);
  layer=L.layerGroup();
  DATA.forEach(d=>{
    L.circleMarker([d.lat,d.lon],{radius:7,color:colorFor(d[mode],mx),fillColor:colorFor(d[mode],mx),fillOpacity:0.85,weight:1})
     .bindTooltip(`<b>${d.name}</b><br>消退 ${d.recess_h}h · 峰值 ${d.peak_m}m · 事件 ${d.events}`)
     .addTo(layer);
  });
  layer.addTo(map);
  document.getElementById('stat').textContent=`共 ${DATA.length} 站 · 当前值范围 0~${mx.toFixed(2)}`;
  // 图例
  const steps=[0,0.25,0.5,0.75,1].map(f=>f*mx);
  document.getElementById('legend').innerHTML='<b>'+({recess_h:'消退时间(h)',peak_m:'峰值水位(m)',events:'积水事件数'}[mode])+'</b><br>'+
    steps.map((s,i)=>`<div class="row"><span class="sw" style="background:${colors[Math.min(colors.length-1,i)]}"></span>${s.toFixed(2)}</div>`).join('');
}
document.getElementById('mode').addEventListener('change',e=>render(e.target.value));
render('recess_h');
</script></body></html>
